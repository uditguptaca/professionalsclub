<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Professionals Club</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0f2318; color: #d8f3dc; text-align: center;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    padding: 2rem calc(1.5rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
  }
  .leaf { width: 56px; height: 53px; margin: 0 auto 1.25rem; color: #f97316; }
  h1 { font-size: 1.35rem; margin: 0 0 0.5rem; color: #fff; }
  p { margin: 0 auto 1.5rem; max-width: 30ch; line-height: 1.55; color: #95d5b2; }
  button {
    min-height: 48px; padding: 0 2rem; border: 0; border-radius: 999px;
    background: #bcdf6a; color: #0f2318; font-size: 1rem; font-weight: 700;
  }
  .pulse {
    display: inline-flex; align-items: center; gap: 0.5rem;
    margin-top: 1.1rem; font-size: 0.85rem; color: #95d5b2;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #bcdf6a;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
<script>
  // Self-healing: probe the app's servers every few seconds and go back the
  // moment one answers. The person should never HAVE to press anything —
  // the button exists for impatience, not necessity.
  var BASES = [
    'http://localhost:3000',                  // dev builds (adb reverse)
    'https://professionalsclub.vercel.app',   // production
  ];

  function probe(base) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error('timeout')); }, 4000);
      // no-cors: an opaque response still proves the server is reachable.
      fetch(base + '/portal/auth', { mode: 'no-cors', cache: 'no-store' })
        .then(function () { clearTimeout(timer); resolve(base); })
        .catch(function (e) { clearTimeout(timer); reject(e); });
    });
  }

  function goOnline(base) {
    // Back returns to exactly where the person was; the portal entry is the
    // fallback when this error page is all the WebView has.
    if (history.length > 1) history.back();
    else location.href = base + '/portal/auth';
  }

  var probing = false;
  function tryReconnect() {
    if (probing) return;
    probing = true;
    Promise.allSettled(BASES.map(probe)).then(function (results) {
      probing = false;
      for (var i = 0; i < results.length; i++) {
        if (results[i].status === 'fulfilled') { goOnline(results[i].value); return; }
      }
    });
  }

  setInterval(tryReconnect, 3000);
  window.addEventListener('online', tryReconnect);
  window.addEventListener('DOMContentLoaded', tryReconnect);

  function retry() { tryReconnect(); }
</script>
</head>
<body>
  <main>
    <svg class="leaf" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M256 24l-30 56c-3 6-9 5-16 1l-38-20 21 100c4 20-9 20-17 11l-59-63-15 41c-2 4-6 4-13 3l-73-15 20 68c4 15 7 21-5 25l-31 15 137 111c6 5 8 13 5 21l-12 39 132-17c4 0 7 3 6 7l-6 100h34l-6-100c-1-4 2-7 6-7l132 17-12-39c-3-8-1-16 5-21l137-111-31-15c-12-4-9-10-5-25l20-68-73 15c-7 1-11 1-13-3l-15-41-59 63c-8 9-21 9-17-11l21-100-38 20c-7 4-13 5-16-1l-30-56z"/></svg>
    <h1>Connection lost</h1>
    <p>Hang tight &mdash; we reconnect automatically the moment the network is back.</p>
    <button onclick="retry()">Try now</button>
    <div class="pulse" role="status"><span class="dot" aria-hidden="true"></span> Checking the connection&hellip;</div>
  </main>
</body>
</html>
